aid: hackerrank
name: HackerRank
description: >-
  HackerRank is a developer skills platform used by companies to screen, interview, and upskill
  technical talent, and by more than 26 million developers to practice coding and earn skill
  certifications. Its products include Screen (automated coding assessments), Interview (collaborative
  real-time coding interviews), Engage (technical hiring events and hackathons), and SkillUp. HackerRank
  for Work exposes a public REST API (v3) so customers can programmatically manage tests, candidates,
  questions, interviews, and results, and integrate assessments into their own applicant-tracking and
  hiring workflows. This API Evangelist profile catalogs HackerRank's developer surface and the
  enrichment artifacts derived from it.
